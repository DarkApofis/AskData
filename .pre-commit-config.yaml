# Install once: uv tool install pre-commit && pre-commit install
# gitleaks runs first so a leaked secret is reported before style failures.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5 # keep in sync with ruff in apps/api/uv.lock
    hooks:
      - id: ruff-check
        files: ^apps/api/
      - id: ruff-format
        files: ^apps/api/

  - repo: local
    hooks:
      - id: eslint
        name: eslint (apps/web)
        language: system
        entry: npm --prefix apps/web run lint
        files: ^apps/web/.*\.(ts|tsx|js|mjs|cjs|jsx)$
        pass_filenames: false
